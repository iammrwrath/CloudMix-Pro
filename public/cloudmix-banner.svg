<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <radialGradient id="bannerBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#11192e" />
      <stop offset="50%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <linearGradient id="cloudMixTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f9ff" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <linearGradient id="proAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="cortexGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="bannerBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="cortexBarBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14112e" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#0c1e30" />
    </linearGradient>

    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cortexGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Background Card -->
  <rect width="1200" height="440" rx="28" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="2" />
  <rect x="0" y="435" width="1200" height="5" fill="url(#bannerBorderGrad)" />

  <!-- Background Decorative Deck Waveforms & Audio Rings -->
  <g opacity="0.10" stroke="#00e5ff" stroke-width="1.5">
    <circle cx="1040" cy="180" r="280" fill="none" stroke-dasharray="8 8" />
    <circle cx="1040" cy="180" r="210" fill="none" />
    <circle cx="1040" cy="180" r="140" fill="none" stroke-dasharray="12 12" />
    <circle cx="1040" cy="180" r="70" fill="none" />
  </g>

  <!-- Background Subtle Sound Waves -->
  <g opacity="0.06" fill="#38bdf8">
    <rect x="970" y="80" width="4" height="200" rx="2" />
    <rect x="985" y="100" width="4" height="160" rx="2" />
    <rect x="1000" y="60" width="4" height="240" rx="2" />
    <rect x="1015" y="110" width="4" height="140" rx="2" />
    <rect x="1030" y="50" width="4" height="260" rx="2" />
    <rect x="1045" y="90" width="4" height="180" rx="2" />
    <rect x="1060" y="70" width="4" height="220" rx="2" />
    <rect x="1075" y="115" width="4" height="130" rx="2" />
    <rect x="1090" y="85" width="4" height="190" rx="2" />
    <rect x="1105" y="125" width="4" height="110" rx="2" />
  </g>

  <!-- ============================================================== -->
  <!-- TOP SECTION: CLOUDMIX PRO PRIMARY BRANDING                     -->
  <!-- ============================================================== -->

  <!-- Left Icon Lockup: CloudMix Pro Motorized Vinyl & Cloud Deck -->
  <g transform="translate(60, 48)">
    <rect width="190" height="190" rx="40" fill="#0b111e" stroke="#1e293b" stroke-width="2" />
    <circle cx="95" cy="95" r="78" fill="none" stroke="url(#bannerBorderGrad)" stroke-width="3.5" filter="url(#bannerGlow)" />

    <!-- Vinyl Outer Grooves -->
    <circle cx="95" cy="95" r="66" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle cx="95" cy="95" r="54" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="14 10" />
    <circle cx="95" cy="95" r="42" fill="none" stroke="#1e293b" stroke-width="2" />

    <!-- Cloud Icon Shape with glowing gradient outline -->
    <path d="M 75 110 C 64 110, 55 102, 55 92 C 55 83, 62 76, 71 75 C 75 64, 85 57, 96 57 C 109 57, 120 66, 123 78 C 131 79, 137 86, 137 94 C 137 103, 130 110, 121 110 Z"
          fill="none" stroke="url(#proAccent)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Turntable Spindle with Audio Indicator -->
    <circle cx="95" cy="95" r="13" fill="#070b14" stroke="#00e5ff" stroke-width="3.5" />
    <circle cx="95" cy="95" r="4.5" fill="#a855f7" />

    <!-- Stylus / Needle Arm Accent -->
    <path d="M 145 48 L 120 73 L 115 68" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="145" cy="48" r="4.5" fill="#00e5ff" />
  </g>

  <!-- Typography & Features Right Side -->
  <g transform="translate(285, 48)">
    <!-- Main Title -->
    <text x="0" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="62" letter-spacing="3" fill="url(#cloudMixTitle)">
      CLOUDMIX <tspan fill="url(#proAccent)">PRO</tspan>
    </text>

    <!-- Subtitle / Category -->
    <text x="4" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="800" font-size="16" letter-spacing="5" fill="#00e5ff">
      NEXT-GEN CLOUD-NATIVE DJ WORKSTATION
    </text>

    <!-- Core Capabilities Line -->
    <text x="4" y="132" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" fill="#94a3b8">
      Real-Time Neural Stems on Live Streams • YouTube Music &amp; Cloud Decks • Studio Multi-FX • OBS HUD
    </text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(4, 155)">
      <g transform="translate(0, 0)">
        <rect width="144" height="28" rx="7" fill="#0c2338" stroke="#0284c7" stroke-width="1" />
        <text x="72" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">
          🧬 Neural Stems
        </text>
      </g>
      <g transform="translate(154, 0)">
        <rect width="166" height="28" rx="7" fill="#1e1338" stroke="#7c3aed" stroke-width="1" />
        <text x="83" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">
          ☁️ Cloud Streaming
        </text>
      </g>
      <g transform="translate(330, 0)">
        <rect width="144" height="28" rx="7" fill="#1f1523" stroke="#db2777" stroke-width="1" />
        <text x="72" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#f472b6" text-anchor="middle">
          🎛️ 8-Pad Sampler
        </text>
      </g>
      <g transform="translate(484, 0)">
        <rect width="148" height="28" rx="7" fill="#0f291e" stroke="#16a34a" stroke-width="1" />
        <text x="74" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#4ade80" text-anchor="middle">
          📺 OBS Studio HUD
        </text>
      </g>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- BOTTOM SECTION: PROMINENT MIXCORTEX AI BANNER                  -->
  <!-- ============================================================== -->
  <g transform="translate(60, 290)">
    <!-- Container Card with Neon Border -->
    <rect width="1080" height="96" rx="18" fill="url(#cortexBarBg)" stroke="#382e66" stroke-width="1.8" />

    <!-- Left MixCortex Brain/Vinyl Hologram Icon -->
    <g transform="translate(24, 16)">
      <rect width="64" height="64" rx="16" fill="#0b0e17" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="32" cy="32" r="26" fill="none" stroke="url(#cortexGlowGrad)" stroke-width="2.2" filter="url(#cortexGlow)" />

      <!-- Left Brain Hemisphere -->
      <path d="M 31 17 C 26 17, 19 20, 18 24 C 16 26, 14 30, 16 34 C 14 37, 15 42, 19 44 C 21 48, 26 50, 31 50 Z"
            fill="none" stroke="#c084fc" stroke-width="2.2" />
      <circle cx="21" cy="24" r="1.5" fill="#e879f9" />
      <circle cx="19" cy="32" r="1.5" fill="#22d3ee" />
      <circle cx="23" cy="42" r="1.5" fill="#e879f9" />

      <!-- Right Vinyl Grooves -->
      <path d="M 33 17 C 38 17, 45 20, 46 24 C 48 26, 50 30, 48 34 C 50 37, 49 42, 45 44 C 43 48, 38 50, 33 50 Z"
            fill="none" stroke="#22d3ee" stroke-width="2.2" />
      <line x1="33" y1="23" x2="41" y2="23" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
      <line x1="33" y1="28" x2="44" y2="28" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" />
      <line x1="33" y1="33" x2="45" y2="33" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
      <line x1="33" y1="38" x2="44" y2="38" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" />
      <line x1="33" y1="43" x2="40" y2="43" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />

      <!-- Center Spindle -->
      <circle cx="32" cy="32" r="3.5" fill="#07090e" stroke="#c084fc" stroke-width="1.5" />
    </g>

    <!-- Center MixCortex Text Information -->
    <g transform="translate(106, 16)">
      <!-- Line 1: Title and Tag -->
      <text x="0" y="25" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" letter-spacing="1.5" fill="#ffffff">
        MIXCORTEX <tspan fill="#c084fc">AI</tspan>
      </text>

      <rect x="180" y="8" width="180" height="22" rx="6" fill="#2e1065" stroke="#9333ea" stroke-width="1" />
      <text x="270" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="bold" fill="#d8b4fe" text-anchor="middle">
        NEURAL DJ CO-PILOT
      </text>

      <!-- Line 2: Detailed Capabilities -->
      <text x="0" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14.5" fill="#cbd5e1">
        Built directly into CloudMix Pro: Real-time harmonic track recommendations, sub-millisecond Camelot wheel key matching, BPM radars, and multi-deck transitions.
      </text>
    </g>

    <!-- Right Side Bridge Compatibility Pills -->
    <g transform="translate(860, 32)">
      <rect width="195" height="32" rx="8" fill="#18182b" stroke="#4f46e5" stroke-width="1" />
      <text x="97" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#a5b4fc" text-anchor="middle">
        ⚡ Standalone + Workstation
      </text>
    </g>
  </g>
</svg>

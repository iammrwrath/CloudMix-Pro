<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bannerBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <linearGradient id="cloudMixTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <linearGradient id="proAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="bannerBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cortexBadgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Background Card -->
  <rect width="1200" height="400" rx="28" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="2" />
  <rect x="0" y="396" width="1200" height="4" fill="url(#bannerBorderGrad)" />

  <!-- Background Decorative Deck Waveforms & Audio Rings -->
  <g opacity="0.10" stroke="#00e5ff" stroke-width="1.5">
    <circle cx="1030" cy="200" r="300" fill="none" stroke-dasharray="8 8" />
    <circle cx="1030" cy="200" r="230" fill="none" />
    <circle cx="1030" cy="200" r="160" fill="none" stroke-dasharray="12 12" />
    <circle cx="1030" cy="200" r="90" fill="none" />
  </g>

  <!-- Background Subtle Sound Waves -->
  <g opacity="0.06" fill="#38bdf8">
    <rect x="960" y="110" width="4" height="180" rx="2" />
    <rect x="975" y="130" width="4" height="140" rx="2" />
    <rect x="990" y="90" width="4" height="220" rx="2" />
    <rect x="1005" y="140" width="4" height="120" rx="2" />
    <rect x="1020" y="70" width="4" height="260" rx="2" />
    <rect x="1035" y="120" width="4" height="160" rx="2" />
    <rect x="1050" y="80" width="4" height="240" rx="2" />
    <rect x="1065" y="135" width="4" height="130" rx="2" />
    <rect x="1080" y="100" width="4" height="200" rx="2" />
    <rect x="1095" y="145" width="4" height="110" rx="2" />
  </g>

  <!-- Left Icon Lockup: CloudMix Pro Motorized Vinyl & Cloud Deck (x=80, y=95) -->
  <g transform="translate(85, 95)">
    <rect width="210" height="210" rx="44" fill="#0b111e" stroke="#1e293b" stroke-width="2" />
    <circle cx="105" cy="105" r="88" fill="none" stroke="url(#bannerBorderGrad)" stroke-width="3.5" filter="url(#bannerGlow)" />

    <!-- Vinyl Outer Grooves -->
    <circle cx="105" cy="105" r="76" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle cx="105" cy="105" r="64" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="14 10" />
    <circle cx="105" cy="105" r="52" fill="none" stroke="#1e293b" stroke-width="2" />

    <!-- Cloud Icon Shape with glowing gradient outline -->
    <path d="M 82 122 C 70 122, 60 114, 60 102 C 60 92, 68 84, 78 83 C 82 71, 93 63, 106 63 C 121 63, 133 73, 136 87 C 145 88, 152 95, 152 104 C 152 114, 144 122, 134 122 Z"
          fill="none" stroke="url(#proAccent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Turntable Spindle with Audio Indicator -->
    <circle cx="105" cy="105" r="14" fill="#070b14" stroke="#00e5ff" stroke-width="3.5" />
    <circle cx="105" cy="105" r="5" fill="#a855f7" />

    <!-- Stylus / Needle Arm Accent -->
    <path d="M 160 52 L 132 80 L 126 74" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="160" cy="52" r="5" fill="#00e5ff" />
  </g>

  <!-- Typography & Features Right Side -->
  <g transform="translate(340, 95)">
    <!-- Main Title -->
    <g transform="translate(0, 0)">
      <text x="0" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="3" fill="url(#cloudMixTitle)">
        CLOUDMIX <tspan fill="url(#proAccent)">PRO</tspan>
      </text>
    </g>

    <!-- Subtitle / Category -->
    <text x="4" y="98" font-family="ui-monospace, monospace" font-weight="700" font-size="16" letter-spacing="6" fill="#00e5ff">
      NEXT-GEN CLOUD-NATIVE DJ WORKSTATION
    </text>

    <!-- Core Capabilities Line -->
    <text x="4" y="134" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#94a3b8">
      Real-Time Neural Stems on Live Streams • YouTube Music &amp; Cloud Decks • Studio Multi-FX • OBS HUD
    </text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(4, 158)">
      <g transform="translate(0, 0)">
        <rect width="146" height="28" rx="7" fill="#0c2338" stroke="#0284c7" stroke-width="1" />
        <text x="73" y="19" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">
          🧬 Neural Stems
        </text>
      </g>
      <g transform="translate(156, 0)">
        <rect width="168" height="28" rx="7" fill="#1e1338" stroke="#7c3aed" stroke-width="1" />
        <text x="84" y="19" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">
          ☁️ Cloud Streaming
        </text>
      </g>
      <g transform="translate(334, 0)">
        <rect width="144" height="28" rx="7" fill="#1f1523" stroke="#db2777" stroke-width="1" />
        <text x="72" y="19" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#f472b6" text-anchor="middle">
          🎛️ 8-Pad Sampler
        </text>
      </g>
      <g transform="translate(488, 0)">
        <rect width="146" height="28" rx="7" fill="#0f291e" stroke="#16a34a" stroke-width="1" />
        <text x="73" y="19" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#4ade80" text-anchor="middle">
          📺 OBS Studio HUD
        </text>
      </g>
    </g>

    <!-- Powered by MixCortex AI Banner Bar on Bottom -->
    <g transform="translate(4, 202)">
      <rect width="770" height="34" rx="9" fill="#111625" stroke="#334155" stroke-width="1.2" />
      
      <!-- Mini Brain Icon for MixCortex -->
      <g transform="translate(12, 7)">
        <circle cx="10" cy="10" r="9" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" />
        <circle cx="7" cy="8" r="1.5" fill="#e879f9" />
        <circle cx="13" cy="8" r="1.5" fill="#22d3ee" />
        <circle cx="10" cy="13" r="1.5" fill="#c084fc" />
      </g>

      <text x="40" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#cbd5e1">
        Powered by <tspan fill="#c084fc" font-weight="800">MixCortex AI</tspan>
      </text>

      <text x="210" y="21" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">
        |
      </text>

      <text x="226" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#94a3b8">
        Neural DJ Co-Pilot • Sub-ms Camelot Wheel Harmonic Matching • Algoriddim / Serato Bridge
      </text>
    </g>
  </g>
</svg>
